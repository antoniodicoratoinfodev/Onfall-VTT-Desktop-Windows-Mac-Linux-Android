name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Il compito e' solo leggere il codice ed eseguire i test: nessuna scrittura.
permissions:
  contents: read

# Un push che ne segue un altro sullo stesso ramo annulla la corsa precedente:
# interessa l'esito dell'ultimo commit, non quello gia' superato.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Il daemon Gradle e' fissato a 21 da gradle/gradle-daemon-jvm.properties,
      # mentre i moduli producono bytecode 17. Fornire qui la 21 evita che Gradle
      # se la scarichi da solo a ogni corsa.
      - name: Prepara JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # Anche i moduli senza test Android passano dalla configurazione di
      # android-app, che senza SDK non si configura affatto.
      - name: Prepara l'SDK Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # `check`, non `test`: shared-ui e' un modulo multipiattaforma e non ha
      # affatto un task `test`, quindi `./gradlew test` ne salterebbe in silenzio
      # tutti i test di interfaccia e di sessione.
      - name: Test
        run: ./gradlew check --console=plain --stacktrace

      # I report restano consultabili anche quando la corsa fallisce, che e'
      # proprio il caso in cui servono.
      - name: Conserva i report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-test
          path: '**/build/reports/tests/**'
          retention-days: 14
          if-no-files-found: ignore

  # Il catalogo SRD e' generato, ma finora solo il *prodotto* era sorvegliato:
  # Gradle legge il JSON committato e non tocca l'estrattore che lo scrive. Una
  # regressione nei generatori sarebbe quindi passata inosservata fino alla
  # rigenerazione successiva, quando il JSON sarebbe cambiato sotto i piedi di
  # chi non c'entrava nulla. Qui si verifica l'altra meta': che gli strumenti
  # funzionino, e che il JSON committato sia ancora cio' che producono.
  contenuti:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepara Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Gli estrattori leggono i PDF ufficiali con `pdftohtml`, che tiene la
      # posizione e il carattere di ogni frammento: e' da li' che si riconoscono
      # titoli, grassetti e colonne. I due PDF sono versionati nel repository,
      # quindi il checkout basta.
      - name: Prepara Poppler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Test degli estrattori
        run: python3 -m unittest discover --start-directory tools/srd --pattern 'test_*.py' --verbose

      # Rigenerare e confrontare: se l'estrattore e il JSON committato non
      # concordano piu', uno dei due e' rimasto indietro.
      - name: Il catalogo committato e' quello che gli strumenti producono
        run: |
          python3 tools/srd/extract_srd_class_features.py --language it --check
          python3 tools/srd/extract_srd_class_features.py --language en --check
          python3 tools/srd/build_srd_crosswalk.py --check
