org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
# La gerarchia dei source set e' dichiarata a mano in shared-ui (jvmSharedMain),
# quindi il template predefinito va disattivato per evitare conflitti.
kotlin.mpp.applyDefaultHierarchyTemplate=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Versione dell'applicazione, sorgente unica: la leggono i pacchetti desktop,
# l'APK Android e la costante Kotlin generata in shared-ui (BuildInfo.kt).
onfall.version=0.4.0
