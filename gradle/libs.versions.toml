[versions]
kotlin = "2.3.21"
compose = "1.11.1"
agp = "9.2.1"
junit = "5.11.4"
serialization = "1.9.0"
activityCompose = "1.13.0"
composeBom = "2026.06.00"
desugar = "2.1.5"

# Java 17 come bersaglio di compilazione: e' il livello massimo che Android
# accetta senza attriti, ed e' gia' quello usato dal motore esistente.
jvmTarget = "17"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# Da AGP 9 i moduli Kotlin Multiplatform richiedono questo plugin
# al posto di 'com.android.library'.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
